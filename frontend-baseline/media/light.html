<!doctype html>
<html lang="en">
<head>
  <!-- @include head.html -->
  <title>Pictures (media, light) · Frontend Baseline</title>
  <meta name="description" content="A responsive hero image and lazy thumbnails, with no script.">
</head>
<body>
  <!-- @include header.html -->
  <main id="main" class="container page">
    <div class="page-header">
      <p class="pattern">Pattern 7 of 23: media and lazy loading</p>
      <!-- @include variant-nav.html -->
      <h1>Pictures</h1>
      <p>Everything an image component does, written by hand: a high-priority hero with <code>srcset</code> and <code>sizes</code>, intrinsic dimensions so nothing shifts, and lazy thumbnails below the fold. No script.</p>
    </div>
    <img src="/images/photo-02-800.png" srcset="/images/photo-02-400.png 400w, /images/photo-02-800.png 800w, /images/photo-02-1200.png 1200w" sizes="(min-width: 74rem) 72rem, calc(100vw - 2rem)" width="1200" height="900" alt="A generated landscape at dawn, the first of the set." fetchpriority="high" style="border-radius: var(--radius); aspect-ratio: 16 / 7; object-fit: cover; margin-bottom: var(--space-6)">
    <h2>Lazy thumbnails</h2>
    <div class="grid" style="grid-template-columns: repeat(auto-fill, minmax(min(100%, 12rem), 1fr))">
      <img src="/images/photo-06-400.png" srcset="/images/photo-06-400.png 400w, /images/photo-06-800.png 800w" sizes="(min-width: 40rem) 12rem, 50vw" width="1200" height="900" alt="Generated landscape 6" loading="lazy" decoding="async" style="border-radius: var(--radius-sm)">
      <img src="/images/photo-07-400.png" srcset="/images/photo-07-400.png 400w, /images/photo-07-800.png 800w" sizes="(min-width: 40rem) 12rem, 50vw" width="1200" height="900" alt="Generated landscape 7" loading="lazy" decoding="async" style="border-radius: var(--radius-sm)">
      <img src="/images/photo-08-400.png" srcset="/images/photo-08-400.png 400w, /images/photo-08-800.png 800w" sizes="(min-width: 40rem) 12rem, 50vw" width="1200" height="900" alt="Generated landscape 8" loading="lazy" decoding="async" style="border-radius: var(--radius-sm)">
      <img src="/images/photo-09-400.png" srcset="/images/photo-09-400.png 400w, /images/photo-09-800.png 800w" sizes="(min-width: 40rem) 12rem, 50vw" width="1200" height="900" alt="Generated landscape 9" loading="lazy" decoding="async" style="border-radius: var(--radius-sm)">
      <img src="/images/photo-10-400.png" srcset="/images/photo-10-400.png 400w, /images/photo-10-800.png 800w" sizes="(min-width: 40rem) 12rem, 50vw" width="1200" height="900" alt="Generated landscape 10" loading="lazy" decoding="async" style="border-radius: var(--radius-sm)">
      <img src="/images/photo-12-400.png" srcset="/images/photo-12-400.png 400w, /images/photo-12-800.png 800w" sizes="(min-width: 40rem) 12rem, 50vw" width="1200" height="900" alt="Generated landscape 12" loading="lazy" decoding="async" style="border-radius: var(--radius-sm)">
    </div>
  </main>
  <!-- @include footer.html -->
</body>
</html>
