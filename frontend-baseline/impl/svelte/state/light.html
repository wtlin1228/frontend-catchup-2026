<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;var l=localStorage.getItem('lang');if(l)document.documentElement.lang=l;}catch(e){}})();</script>
  <title>To-do (state, light) · Frontend Baseline, Svelte port</title>
  <meta name="description" content="A persisted to-do list: the smallest stateful UI.">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/pages/state-light.js"></script>
</body>
</html>
