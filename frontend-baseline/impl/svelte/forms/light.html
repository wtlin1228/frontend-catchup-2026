<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;var l=localStorage.getItem('lang');if(l)document.documentElement.lang=l;}catch(e){}})();</script>
  <title>Newsletter (forms, light) · Frontend Baseline, Svelte port</title>
  <meta name="description" content="A form with no script of its own: native validation and a full-page submit, rendered by React.">
</head>
<body>
  <div id="root"></div>
  <noscript><p>This port renders in the browser; with scripts off the form is not there. The baseline's version submits without JavaScript.</p></noscript>
  <script type="module" src="/src/pages/forms-light.js"></script>
</body>
</html>
